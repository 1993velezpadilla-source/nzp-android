name: Validate Shadows of Evil full city

on:
  push:
    branches:
      - main
      - feature/shadows-of-evil-completion
  pull_request:

concurrency:
  group: soe-full-city-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-full-city:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate integrated Morg City
        run: python scripts/generate_soe_full_city.py

      - name: Verify integrated map is deterministic
        run: python scripts/generate_soe_full_city.py --check

      - name: Static integrated-map audit
        run: python tools/validate_soe_full_city.py

      - name: Checkout pinned NZ:P assets
        uses: actions/checkout@v4
        with:
          repository: nzp-team/assets
          ref: c8135a66e00bb64577912fbf792f8fef7f47658e
          path: upstream-assets

      - name: Checkout pinned NZ:P spawn-zone tool
        uses: actions/checkout@v4
        with:
          repository: nzp-team/spawn-zone-tool
          ref: 3c6f9b87208026d7d639565deed64e541ffb18bf
          path: spawn-zone-tool
          submodules: recursive

      - name: Install spawn-zone tool requirements
        run: python -m pip install -r spawn-zone-tool/requirements.txt

      - name: Apply project asset overlay
        run: python scripts/apply_soe_asset_overlay.py --assets-root upstream-assets

      - name: Compile NZ:P WADs
        working-directory: upstream-assets
        run: bash tools/compile-wads.sh

      - name: Compile integrated runtime map package
        working-directory: upstream-assets
        run: |
          set -o pipefail
          bash tools/compile-maps.sh -m soe/soe.map --zone-tool-path "${GITHUB_WORKSPACE}/spawn-zone-tool" 2>&1 | tee soe-vhlt.log

      - name: Enforce integrated mobile compile budgets
        run: python tools/validate_soe_compile_budget.py --log upstream-assets/soe-vhlt.log

      - name: Require integrated BSP and NSZ output
        run: |
          test -s upstream-assets/common/maps/soe.bsp
          test -s upstream-assets/common/maps/soe.nsz
          grep -q '^number_of_zones: 32      - name: Upload integrated Morg City runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: soe-integrated-runtime
          path: |
            upstream-assets/common/maps/soe.bsp
            upstream-assets/common/maps/soe.nsz
            upstream-assets/source/maps/soe/soe.map
            upstream-assets/soe-vhlt.log
          if-no-files-found: error
 upstream-assets/common/maps/soe.nsz

      - name: Validate generated NZP spawn-zone runtime file
        run: python tools/validate_soe_nsz.py --file upstream-assets/common/maps/soe.nsz --expected-zones 32

      - name: Upload integrated Morg City runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: soe-integrated-runtime
          path: |
            upstream-assets/common/maps/soe.bsp
            upstream-assets/common/maps/soe.nsz
            upstream-assets/source/maps/soe/soe.map
            upstream-assets/soe-vhlt.log
          if-no-files-found: error
