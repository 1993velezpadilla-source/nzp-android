name: Validate Shadows of Evil data

on:
  push:
    branches:
      - main
      - feature/shadows-of-evil-completion
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SoE data contracts
        run: python tools/validate_soe_data.py

      - name: Validate end-to-end quest runtime contracts
        run: python tools/validate_soe_quest_runtime.py
