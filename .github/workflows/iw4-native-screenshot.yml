name: IW4 Native Android Screenshot

on:
  workflow_dispatch:
  push:
    branches:
      - "research/iw4-t4-native-android"
    paths:
      - "iw4-native/**"
      - ".github/workflows/iw4-native-screenshot.yml"

permissions:
  contents: read

concurrency:
  group: iw4-native-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build reproducible Sanctum preview
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet objaverse trimesh numpy huggingface_hub
          mkdir -p build/sanctum-source
          mkdir -p iw4-native/android-app/app/src/main/assets/maps
          python3 iw4-native/tools/build_sanctum_preview.py \
            --cache-dir build/sanctum-source \
            --out iw4-native/android-app/app/src/main/assets/maps/sanctum_preview.snp1 \
            --report iw4-native/android-app/app/src/main/assets/maps/sanctum_preview_report.json \
            --target-triangles 24000

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build x86_64 screenshot APK
        run: gradle -p iw4-native/android-app -PscreenshotBuild=1 :app:assembleDebug --stacktrace

      - name: Capture real app screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          target: default
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/scripts/iw4-capture-screenshot.sh

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: IW4-Native-Sanctum-Screenshot
          path: |
            dist/iw4-native-sanctum.png
            dist/iw4-native-logcat.txt
            iw4-native/android-app/app/src/main/assets/maps/sanctum_preview_report.json
          if-no-files-found: error
          retention-days: 14
